{% extends "base.html" %}

{% block title %}Nova senha — NeuroClinic{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">Escolha uma nova senha</h1>
                {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
                <form method="post" action="/redefinir-senha/{{ token }}" novalidate>
                    <div class="mb-3">
                        <label for="nova_senha" class="form-label">Nova senha</label>
                        <input type="password" id="nova_senha" name="nova_senha" required
                               class="form-control {% if erros.nova_senha %}is-invalid{% endif %}"
                               autocomplete="new-password">
                        {% if erros.nova_senha %}
                        <div class="invalid-feedback">{{ erros.nova_senha }}</div>
                        {% else %}
                        <div class="form-text">Mínimo de 8 caracteres.</div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
