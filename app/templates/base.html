<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NeuroClinic{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">NeuroClinic</a>
            <div class="d-flex align-items-center gap-2">
                {% if usuario %}
                <span class="navbar-text text-white small">{{ usuario.nome }}</span>
                <form method="post" action="/logout" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
                {% else %}
                <a class="btn btn-outline-light btn-sm" href="/login">Entrar</a>
                <a class="btn btn-light btn-sm" href="/cadastro">Criar conta</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
