[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# A URL real vem do .env via alembic/env.py — esta linha aqui é só
# um valor de fallback, não é o que efetivamente será usado.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/neuroclinic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
